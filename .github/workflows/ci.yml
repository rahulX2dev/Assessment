name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  gateway:
    name: API gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/api-gateway/package-lock.json

      - name: Install dependencies
        working-directory: backend/api-gateway
        run: npm ci

      - name: Audit production dependencies
        working-directory: backend/api-gateway
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax check every module
        working-directory: backend/api-gateway
        run: |
          for file in $(find src -name '*.js'); do
            node --check "$file"
          done

      - name: Boot smoke test
        working-directory: backend/api-gateway
        env:
          JWT_SECRET: ci-secret-value-at-least-32-characters
          PORT: 8080
        run: |
          node src/server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/api/v1/billing/plans | head -c 200
          kill $SERVER_PID

  core-service:
    name: Core service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and test
        working-directory: backend/core-service
        run: mvn -B clean verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: core-service-jar
          path: backend/core-service/target/*.jar
          retention-days: 7

  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/ai-service/requirements.txt

      - name: Install dependencies
        working-directory: backend/ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import and app construction check
        working-directory: backend/ai-service
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"

      - name: Classifier behaviour check
        working-directory: backend/ai-service
        run: |
          python - <<'PY'
          from app.services.assistant import classify
          from app.schemas import Intent

          cases = {
              "How much does the Growth plan cost?": Intent.PRICING_ENQUIRY,
              "Can I pay in two instalments?": Intent.PAYMENT_PLAN_REQUEST,
              "The dashboard is broken and throws an error": Intent.SUPPORT_ISSUE,
              "Please unsubscribe me": Intent.OPT_OUT,
          }

          for text, expected in cases.items():
              actual = classify(text).intent
              assert actual is expected, f"{text!r} -> {actual} (expected {expected})"

          print(f"{len(cases)} intent assertions passed")
          PY

  native:
    name: C and C++ engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential valgrind

      - name: Build C++ engine
        working-directory: backend/engine-cpp
        run: make all

      - name: Build C utility
        working-directory: backend/fileops-c
        run: make all

      - name: Run campaign engine over the sample CSV
        working-directory: backend/engine-cpp
        run: |
          mkdir -p reports
          ./bin/hubflow_engine --input ../../samples/contacts.csv --out reports \
            --campaign cmp_ci --format json --workers 4
          cat reports/cmp_ci_report.json

      - name: Run delivery report generator
        working-directory: backend/fileops-c
        run: |
          ./bin/hubflow_fileops report --input ../../samples/delivery_report.csv --campaign cmp_ci
          ./bin/hubflow_fileops stats --input ../../samples/contacts.csv

      - name: Check for memory leaks
        working-directory: backend/fileops-c
        run: |
          valgrind --leak-check=full --errors-for-leak-kinds=definite --error-exitcode=1 \
            ./bin/hubflow_fileops report --input ../../samples/delivery_report.csv --campaign cmp_ci

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [frontend, gateway, core-service, ai-service, native]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: |
          for target in gateway core ai engine frontend; do
            echo "::group::building $target"
            docker build -f deployment/docker/Dockerfile.$target -t hubflow-$target:ci .
            echo "::endgroup::"
          done
