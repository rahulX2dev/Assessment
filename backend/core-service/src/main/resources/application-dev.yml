spring:
  datasource:
    url: jdbc:h2:mem:hubflow;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  sql:
    init:
      mode: always
      data-locations: classpath:seed/dev-seed.sql

hubflow:
  otp:
    expose-code: true

logging:
  level:
    org.hibernate.SQL: INFO
