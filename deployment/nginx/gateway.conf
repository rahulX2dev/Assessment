upstream hubflow_frontend {
    server frontend:80;
    keepalive 16;
}

upstream hubflow_gateway {
    least_conn;
    server api-gateway:8080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name hubflow.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hubflow.local;

    ssl_certificate     /etc/nginx/certs/hubflow.crt;
    ssl_certificate_key /etc/nginx/certs/hubflow.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 12m;
    limit_conn conn_per_ip 40;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://hubflow_gateway;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://hubflow_gateway;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /ws {
        proxy_pass http://hubflow_gateway;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://hubflow_frontend;
    }
}
