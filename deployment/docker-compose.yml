name: hubflow

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: hubflow
      MYSQL_USER: ${MYSQL_USER:-hubflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hubflowpassword}
    command: --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/mysql:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hubflow]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hubflow_analytics
      POSTGRES_USER: ${POSTGRES_USER:-hubflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubflowpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hubflow} -d hubflow_analytics"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hubflow]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [hubflow]

  core-service:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.core
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: hubflow
      MYSQL_USER: ${MYSQL_USER:-hubflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hubflowpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars-long}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-shared-secret-between-internal-services}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-hubflow-webhook-verify}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8081:8081"
    networks: [hubflow]

  ai-service:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.ai
    environment:
      APP_ENV: production
      POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-hubflow}:${POSTGRES_PASSWORD:-hubflowpassword}@postgres:5432/hubflow_analytics
      REDIS_URL: redis://redis:6379/1
      CORE_SERVICE_URL: http://core-service:8081
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars-long}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-shared-secret-between-internal-services}
      CORS_ORIGINS: http://localhost,http://localhost:5173
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"
    networks: [hubflow]

  api-gateway:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.gateway
    environment:
      NODE_ENV: production
      PORT: 8080
      CORE_SERVICE_URL: http://core-service:8081
      AI_SERVICE_URL: http://ai-service:8000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars-long}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-shared-secret-between-internal-services}
      CORS_ORIGINS: http://localhost,http://localhost:5173
      UPLOAD_DIR: /app/uploads
    depends_on:
      redis: { condition: service_healthy }
      core-service: { condition: service_started }
      ai-service: { condition: service_started }
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    networks: [hubflow]

  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.frontend
      args:
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-/api}
        VITE_STORE_API_URL: ${VITE_STORE_API_URL:-https://fakestoreapi.com}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-12000}
        VITE_GATEWAY_TIMEOUT: ${VITE_GATEWAY_TIMEOUT:-6000}
    depends_on:
      - api-gateway
    networks: [hubflow]

  edge:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - api-gateway
    networks: [hubflow]

  engine:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.engine
    volumes:
      - uploads:/app/inbox
      - reports:/app/reports
    profiles: ["tools"]
    networks: [hubflow]

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  uploads:
  reports:

networks:
  hubflow:
    driver: bridge
